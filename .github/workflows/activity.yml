name: activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/activity.py"
      - ".github/workflows/activity.yml"

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_USER: Harsh-M-T
      GITHUB_TOKEN: ${{ secrets.PAT_REPO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate activity section
        run: python3 scripts/activity.py

      - name: Commit if the data moved
        run: |
          if [ -z "$(git status --porcelain portfolio.svg 0x004-activity.svg)" ]; then
            echo "no change — skipping commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio.svg 0x004-activity.svg
          git commit -m "chore: refresh activity [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
